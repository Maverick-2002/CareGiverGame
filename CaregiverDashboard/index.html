<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Care Rush Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    p {
      text-align: center;
      color: #888;
    }

    .refresh {
      display: block;
      margin: 10px auto 20px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    #status {
      text-align: center;
      color: #888;
      margin-bottom: 10px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #4CAF50;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>
<body>

  <h1>Care Rush — Player Metrics</h1>
  <p>Live data from AWS</p>

  <button class="refresh" onclick="loadMetrics()">
    Refresh
  </button>

  <div id="status">Loading...</div>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>Score</th>
        <th>Tasks</th>
        <th>Correct Choices</th>
        <th>Peak Stress</th>
        <th>Empathy Moments</th>
        <th>Time (s)</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

<script>
const API = "https://wyn51co0gh.execute-api.us-east-1.amazonaws.com/prod/metrics";

async function loadMetrics() {
  const body = document.getElementById("tableBody");
  const status = document.getElementById("status");
  status.textContent = "Loading...";

  try {
    const res = await fetch(API);
    const data = await res.json();

    if (!data.length) {
      body.innerHTML = "<tr><td colspan='8' style='text-align:center'>No data</td></tr>";
      status.textContent = "No sessions found.";
      return;
    }

    // show latest 10 sessions only
    const filtered = data
      .sort((a, b) => 
        b.timestamp.localeCompare(a.timestamp))
      .slice(0, 10);

    body.innerHTML = "";
    filtered.forEach(item => {
      body.innerHTML += `
        <tr>
          <td>${item.playerName ?? "-"}</td>
          <td>${item.finalScore ?? 0}</td>
          <td>${item.tasksCompleted ?? 0}/3</td>
          <td>${item.correctChoices ?? 0}/3</td>
          <td>${parseFloat(item.peakStress ?? 0).toFixed(1)}%</td>
          <td>${item.empathyAwareness ?? 
            item.confusionTriggersHit ?? 0}</td>
          <td>${parseFloat(item.sessionTime ?? 0).toFixed(1)}</td>
          <td>${item.timestamp ? 
            new Date(item.timestamp).toLocaleString() : "-"}</td>
        </tr>`;
    });

    status.textContent = "Last updated: " + 
      new Date().toLocaleTimeString();

  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
}

window.onload = loadMetrics;
setInterval(loadMetrics, 5000);
</script>
</body>
</html>
